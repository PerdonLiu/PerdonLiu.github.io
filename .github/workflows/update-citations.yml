name: Update Google Scholar citations

on:
  schedule:
    - cron: '20 1 * * *' # Daily at 09:20 Asia/Shanghai (execution may be delayed)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Google Scholar statistics
        run: python scripts/update_citations.py
      - name: Save updated badge
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m "Update Google Scholar citations"
            git push
          fi
